<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Fleming's Left-Hand Rule Animated Educational Diagram</title>
<desc id="svgDesc">Animated educational diagram of Fleming's left-hand rule showing magnetic field, conventional current, and force.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#475569}.section-title{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;font-weight:600}.tiny{font-size:13px;font-weight:600}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.fieldLine{fill:none;stroke:#1565c0;stroke-width:4;marker-end:url(#arrowBlue);stroke-dasharray:14 10;animation:fieldFlow 1.2s linear infinite}.currentParticle{fill:#ffd21f;stroke:#5f4900;stroke-width:2;animation:currentFlow 1.4s linear infinite}.forcePulse{animation:forcePulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.handBase{fill:#f3c6a5;stroke:#5b3a29;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.handLine{fill:none;stroke:#8b5e45;stroke-width:3;stroke-linecap:round}.fingerField{fill:#dbeafe;stroke:#1565c0;stroke-width:5}.fingerCurrent{fill:#fff2a8;stroke:#8a6500;stroke-width:5}.fingerForce{fill:#fee2e2;stroke:#c62828;stroke-width:5}.stepBox{fill:#fff;stroke:#cbd5e1;stroke-width:2}.stepText{font-size:17px;font-weight:700}.stage{opacity:.16}
#stageField{animation:stageField 30s linear infinite}#stageCurrent{animation:stageCurrent 30s linear infinite}#stageHand{animation:stageHand 30s linear infinite}#stageForce{animation:stageForce 30s linear infinite}#step1{animation:step1 30s linear infinite}#step2{animation:step2 30s linear infinite}#step3{animation:step3 30s linear infinite}#step4{animation:step4 30s linear infinite}#step5{animation:step5 30s linear infinite}#conductorAssembly{animation:conductorMove 30s ease-in-out infinite;transform-box:fill-box;transform-origin:center}#forceVisual{animation:forceVisibility 30s linear infinite}#summaryCard{animation:summaryVisibility 30s linear infinite}
@keyframes fieldFlow{to{stroke-dashoffset:-24}}@keyframes currentFlow{from{transform:translateY(45px)}to{transform:translateY(-70px)}}@keyframes forcePulse{0%,100%{transform:translateX(0) scale(1)}50%{transform:translateX(-8px) scale(1.04)}}@keyframes stageField{0%,19%{opacity:1}20%,79%{opacity:.28}80%,100%{opacity:1}}@keyframes stageCurrent{0%,19%{opacity:.16}20%,39%{opacity:1}40%,79%{opacity:.28}80%,100%{opacity:1}}@keyframes stageHand{0%,39%{opacity:.16}40%,59%{opacity:1}60%,79%{opacity:.42}80%,100%{opacity:1}}@keyframes stageForce{0%,59%{opacity:.12}60%,100%{opacity:1}}@keyframes step1{0%,19%{fill:#e3f2fd;stroke:#1565c0}}@keyframes step2{20%,39%{fill:#fff8cc;stroke:#8a6500}}@keyframes step3{40%,59%{fill:#eef2ff;stroke:#4f46e5}}@keyframes step4{60%,79%{fill:#fee2e2;stroke:#c62828}}@keyframes step5{80%,100%{fill:#ecfdf5;stroke:#047857}}@keyframes forceVisibility{0%,59%{opacity:0}60%,100%{opacity:1}}@keyframes summaryVisibility{0%,79%{opacity:0}80%,100%{opacity:1}}@keyframes conductorMove{0%,59%{transform:translateX(0)}64%{transform:translateX(-18px)}69%{transform:translateX(0)}74%{transform:translateX(-18px)}79%,100%{transform:translateX(0)}}
</style>
<defs>
<marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1565c0"/></marker>
<marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#8a6500"/></marker>
</defs>
<rect width="1400" height="900" fill="#fff"/>
<!-- Header -->
<text x="700" y="48" text-anchor="middle" class="title">Fleming's Left-Hand Rule</text>
<text x="700" y="78" text-anchor="middle" class="subtitle">Magnetic field + current → force on the conductor</text>
<!-- Steps -->
<g><rect id="step1" class="stepBox" x="70" y="100" width="235" height="54" rx="12"/><text x="187" y="123" text-anchor="middle" class="tiny">STEP 1</text><text x="187" y="143" text-anchor="middle" class="stepText">Magnetic Field</text>
<rect id="step2" class="stepBox" x="325" y="100" width="235" height="54" rx="12"/><text x="442" y="123" text-anchor="middle" class="tiny">STEP 2</text><text x="442" y="143" text-anchor="middle" class="stepText">Current</text>
<rect id="step3" class="stepBox" x="580" y="100" width="235" height="54" rx="12"/><text x="697" y="123" text-anchor="middle" class="tiny">STEP 3</text><text x="697" y="143" text-anchor="middle" class="stepText">Left Hand</text>
<rect id="step4" class="stepBox" x="835" y="100" width="235" height="54" rx="12"/><text x="952" y="123" text-anchor="middle" class="tiny">STEP 4</text><text x="952" y="143" text-anchor="middle" class="stepText">Force / Motion</text>
<rect id="step5" class="stepBox" x="1090" y="100" width="235" height="54" rx="12"/><text x="1207" y="123" text-anchor="middle" class="tiny">STEP 5</text><text x="1207" y="143" text-anchor="middle" class="stepText">Summary</text></g>
<!-- Magnetic field setup -->
<g transform="translate(55,180)"><rect class="panel" width="760" height="500" rx="18"/><text x="380" y="38" text-anchor="middle" class="section-title">Conductor Inside a Magnetic Field</text>
<rect x="45" y="115" width="150" height="260" rx="12" fill="#dbeafe" stroke="#1565c0" stroke-width="4"/><text x="120" y="225" text-anchor="middle" font-size="70" font-weight="700" fill="#0d47a1">N</text><text x="120" y="260" text-anchor="middle" class="small">NORTH</text>
<rect x="565" y="115" width="150" height="260" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/><text x="640" y="225" text-anchor="middle" font-size="70" font-weight="700" fill="#b91c1c">S</text><text x="640" y="260" text-anchor="middle" class="small">SOUTH</text>
<g id="stageField" class="stage"><text x="380" y="83" text-anchor="middle" class="label" fill="#0d47a1">Magnetic Field (B): N → S</text><path class="fieldLine" d="M205 145H550"/><path class="fieldLine" d="M205 195H550"/><path class="fieldLine" d="M205 245H550"/><path class="fieldLine" d="M205 295H550"/><path class="fieldLine" d="M205 345H550"/></g>
<g id="conductorAssembly"><g id="stageCurrent" class="stage"><rect x="354" y="100" width="52" height="290" rx="20" fill="#4b5563" stroke="#111827" stroke-width="4"/><line x1="440" y1="330" x2="440" y2="155" stroke="#8a6500" stroke-width="7" marker-end="url(#arrowYellow)"/><text x="465" y="245" class="label">Current ↑</text><circle class="currentParticle" cx="380" cy="330" r="8"/><circle class="currentParticle" cx="380" cy="275" r="8" style="animation-delay:-.35s"/><circle class="currentParticle" cx="380" cy="220" r="8" style="animation-delay:-.7s"/><circle class="currentParticle" cx="380" cy="165" r="8" style="animation-delay:-1.05s"/></g></g>
<g id="forceVisual"><circle cx="380" cy="245" r="52" fill="#fff" stroke="#c62828" stroke-width="6"/><line x1="354" y1="219" x2="406" y2="271" stroke="#c62828" stroke-width="8"/><line x1="406" y1="219" x2="354" y2="271" stroke="#c62828" stroke-width="8"/><text x="380" y="450" text-anchor="middle" class="label" fill="#991b1b">FORCE: INTO SCREEN ⊗</text></g></g>
<!-- Left hand -->
<g transform="translate(840,180)"><rect class="panel" width="505" height="500" rx="18"/><text x="252" y="38" text-anchor="middle" class="section-title">Fleming's Left Hand</text><g id="stageHand" class="stage">
<path class="handBase" d="M190 310C175 285 174 255 185 225L207 172C213 158 230 157 239 169L247 181V114C247 95 272 91 281 107L287 121V183L304 125C309 107 334 107 340 125L343 143L331 204L353 160C361 144 384 150 387 168L388 186L362 257C354 280 349 304 349 330V397H205C207 362 203 335 190 310Z"/>
<path class="fingerField" d="M238 177V142C238 128 248 118 262 118H410C429 118 439 130 439 144C439 159 428 169 411 169H279V185Z"/><text x="340" y="100" text-anchor="middle" class="small" fill="#0d47a1">FIRST FINGER = FIELD</text>
<path class="fingerCurrent" d="M286 183V84C286 65 298 54 313 54C329 54 340 66 340 83V191Z"/><text x="305" y="28" text-anchor="middle" class="tiny" fill="#6b5000">SECOND FINGER = CURRENT</text>
<path class="fingerForce" d="M198 284C172 278 145 278 118 284L79 294C61 299 50 288 52 272C54 260 63 253 76 249L145 226C169 218 188 222 207 236Z"/><text x="105" y="330" text-anchor="middle" class="small" fill="#991b1b">THUMB = FORCE</text>
</g></g>
<!-- Bottom explanation -->
<g transform="translate(55,705)"><rect width="1290" height="155" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="25" y="32" class="section-title">Remember</text>
<circle cx="38" cy="70" r="14" fill="#1565c0"/><text x="65" y="76" class="label">First finger → Magnetic field (B)</text>
<circle cx="445" cy="70" r="14" fill="#ffd21f" stroke="#6b5000" stroke-width="2"/><text x="472" y="76" class="label">Second finger → Current (I)</text>
<circle cx="865" cy="70" r="14" fill="#c62828"/><text x="892" y="76" class="label">Thumb → Force / motion (F)</text>
<text x="25" y="125" class="small">Keep all three mutually perpendicular. In this example: B → right, I → up, therefore F → into the screen.</text></g>
<!-- Summary -->
<g id="summaryCard"><rect x="360" y="260" width="680" height="300" rx="24" fill="#fff" stroke="#047857" stroke-width="4"/><text x="700" y="315" text-anchor="middle" font-size="27" font-weight="700" fill="#065f46">Fleming's Left-Hand Rule — Summary</text><text x="440" y="375" class="label" fill="#1565c0">First finger = Magnetic Field (B)</text><text x="440" y="425" class="label" fill="#6b5000">Second finger = Conventional Current (I)</text><text x="440" y="475" class="label" fill="#c62828">Thumb = Force / Motion (F)</text><text x="700" y="525" text-anchor="middle" class="label" fill="#065f46">B → right + I → up = F → into the screen</text></g>
</svg>