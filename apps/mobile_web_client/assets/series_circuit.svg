<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Definition for markers -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 0 0.5 L 5 3 L 0 5.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Wires (Main Loop) -->
  <!-- Left to right top wire -->
  <path d="M 50 60 L 95 60 M 125 60 L 175 60 M 205 60 L 255 60 M 285 60 L 350 60 L 350 140 L 240 140 M 210 140 L 190 140 M 155 140 L 130 140 M 110 140 L 50 140 L 50 60" fill="none" stroke="#94A3B8" stroke-width="2" />

  <!-- Voltmeter parallel wires -->
  <path d="M 60 60 L 60 20 L 185 20 M 340 60 L 340 20 L 215 20" fill="none" stroke="#94A3B8" stroke-width="1" />

  <!-- Voltmeter (V) -->
  <circle cx="200" cy="20" r="15" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" />
  <text x="200" y="24" fill="#1E293B" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">V</text>

  <!-- Resistor 1 (R1) -->
  <path d="M 95 60 L 99 54 L 104 66 L 109 54 L 114 66 L 119 54 L 122 66 L 125 60" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="110" y="46" fill="#94A3B8" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">R1</text>

  <!-- Resistor 2 (R2) -->
  <path d="M 175 60 L 179 54 L 184 66 L 189 54 L 194 66 L 199 54 L 202 66 L 205 60" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="190" y="46" fill="#94A3B8" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">R2</text>

  <!-- Resistor 3 (R3) -->
  <path d="M 255 60 L 259 54 L 264 66 L 269 54 L 274 66 L 279 54 L 282 66 L 285 60" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="270" y="46" fill="#94A3B8" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">R3</text>

  <!-- Ammeter (A) -->
  <circle cx="225" cy="140" r="15" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" />
  <text x="225" y="144" fill="#1E293B" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">A</text>

  <!-- Battery -->
  <g transform="translate(165, 140)">
    <line x1="-10" y1="-10" x2="-10" y2="10" stroke="#475569" stroke-width="2" />
    <line x1="-4" y1="-6" x2="-4" y2="6" stroke="#475569" stroke-width="3.5" />
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#94A3B8" stroke-width="2" />
    <line x1="4" y1="-10" x2="4" y2="10" stroke="#475569" stroke-width="2" />
    <line x1="10" y1="-6" x2="10" y2="6" stroke="#475569" stroke-width="3.5" />
    <text x="-18" y="-12" fill="#EF4444" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">+</text>
    <text x="18" y="-12" fill="#EF4444" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">-</text>
  </g>

  <!-- Key (K) -->
  <g transform="translate(120, 140)">
    <path d="M -10 -6 A 8 8 0 0 1 -2 6" fill="none" stroke="#94A3B8" stroke-width="2" />
    <path d="M 2 -6 A 8 8 0 0 0 10 6" fill="none" stroke="#94A3B8" stroke-width="2" />
    <circle cx="0" cy="0" r="2" fill="#64748B" />
  </g>

  <!-- Direction Arrows -->
  <line x1="50" y1="105" x2="50" y2="100" stroke="#EF4444" stroke-width="1" marker-end="url(#arrow)" />
  <text x="60" y="103" fill="#EF4444" font-family="sans-serif" font-size="8.5" font-weight="bold">I</text>

  <line x1="350" y1="95" x2="350" y2="100" stroke="#EF4444" stroke-width="1" marker-end="url(#arrow)" />
</svg>
