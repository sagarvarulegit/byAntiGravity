<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Definitions for Arrow Markers along the loops -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 0 0.5 L 5 3 L 0 5.5 z" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- Title Label -->
  <text x="200" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Magnetic Field Lines (N ➔ S)</text>

  <!-- Magnetic Field Loops (Top & Bottom) -->
  <!-- Upper Loops -->
  <path d="M 160 90 C 130 35, 270 35, 240 90" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="0" marker-mid="url(#arrow)" />
  <path d="M 160 90 C 105 10, 295 10, 240 90" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="0" />
  <path d="M 160 90 C 80 -15, 320 -15, 240 90" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="0" />

  <!-- Lower Loops -->
  <path d="M 160 110 C 130 165, 270 165, 240 110" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="0" />
  <path d="M 160 110 C 105 190, 295 190, 240 110" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="0" />
  <path d="M 160 110 C 80 215, 320 215, 240 110" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="0" />

  <!-- Side diverging paths -->
  <!-- Left (N) diverging -->
  <path d="M 140 100 Q 80 60, 50 50" fill="none" stroke="#94A3B8" stroke-width="1.2" />
  <path d="M 140 100 Q 80 140, 50 150" fill="none" stroke="#94A3B8" stroke-width="1.2" />
  <!-- Right (S) converging -->
  <path d="M 260 100 Q 320 60, 350 50" fill="none" stroke="#94A3B8" stroke-width="1.2" />
  <path d="M 260 100 Q 320 140, 350 150" fill="none" stroke="#94A3B8" stroke-width="1.2" />

  <!-- Bar Magnet -->
  <rect x="140" y="84" width="120" height="32" rx="4" fill="#000000" fill-opacity="0.04" stroke="#64748B" stroke-width="1.5" />
  <!-- North (Red) Half -->
  <rect x="141" y="85" width="59" height="30" fill="#E11D48" fill-opacity="0.15" />
  <!-- South (Blue) Half -->
  <rect x="200" y="85" width="59" height="30" fill="#0284C7" fill-opacity="0.15" />
  <!-- Divider -->
  <line x1="200" y1="84" x2="200" y2="116" stroke="#64748B" stroke-width="1" />

  <!-- Labels on Magnet -->
  <text x="170" y="105" fill="#E11D48" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">N</text>
  <text x="230" y="105" fill="#0284C7" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">S</text>

  <!-- Arrowheads along top & bottom loops (manual overlays since marker-mid orient-auto is finicky) -->
  <g transform="translate(200, 48) rotate(90)"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="#94A3B8" /></g>
  <g transform="translate(200, 30) rotate(90)"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="#94A3B8" /></g>
  <g transform="translate(200, 11) rotate(90)"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="#94A3B8" /></g>

  <g transform="translate(200, 147) rotate(270)"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="#94A3B8" /></g>
  <g transform="translate(200, 167) rotate(270)"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="#94A3B8" /></g>
  <g transform="translate(200, 187) rotate(270)"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="#94A3B8" /></g>
</svg>
