<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <!-- Left Column -->
  <!-- 1. Electric Cell -->
  <g transform="translate(10, 10)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Electric Cell</text>
    <line x1="120" y1="10" x2="135" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="135" y1="0" x2="135" y2="20" stroke="#64748B" stroke-width="1.5" />
    <line x1="142" y1="5" x2="142" y2="15" stroke="#475569" stroke-width="3" />
    <line x1="142" y1="10" x2="160" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <text x="123" y="1" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">+</text>
    <text x="148" y="1" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">-</text>
  </g>

  <!-- 2. Plug Key (Open) -->
  <g transform="translate(10, 50)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Plug Key (Open)</text>
    <line x1="120" y1="10" x2="130" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 130 4 A 8 8 0 0 0 138 16" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 142 4 A 8 8 0 0 1 150 16" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="150" y1="10" x2="160" y2="10" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- 3. Wire Joint -->
  <g transform="translate(10, 90)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Wire Joint</text>
    <line x1="120" y1="10" x2="160" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="140" y1="10" x2="140" y2="-5" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="140" cy="10" r="2.5" fill="#64748B" />
  </g>

  <!-- 4. Electric Bulb -->
  <g transform="translate(10, 130)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Electric Bulb</text>
    <line x1="120" y1="10" x2="132" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="148" y1="10" x2="160" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="140" cy="5" r="10" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 132 10 Q 135 2, 140 7 T 148 10" fill="none" stroke="#64748B" stroke-width="1.5" />
  </g>

  <!-- 5. Variable Resistor / Rheostat -->
  <g transform="translate(10, 170)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Rheostat</text>
    <line x1="120" y1="10" x2="125" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 125 10 L 127.5 4 L 132.5 16 L 137.5 4 L 142.5 16 L 147.5 4 L 152.5 16 L 155 10" fill="none" stroke="#64748B" stroke-width="1.5" />
    <line x1="155" y1="10" x2="160" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="125" y1="20" x2="155" y2="-2" stroke="#EF4444" stroke-width="1.2" />
    <polygon points="155,-2 150,-2 155,3" fill="#EF4444" />
  </g>

  <!-- 6. Voltmeter -->
  <g transform="translate(10, 210)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Voltmeter</text>
    <line x1="120" y1="10" x2="130" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="140" cy="10" r="10" fill="none" stroke="#0284C7" stroke-width="1.5" />
    <text x="140" y="13" fill="#1E293B" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">V</text>
    <line x1="150" y1="10" x2="160" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <text x="122" y="1" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">+</text>
    <text x="152" y="1" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">-</text>
  </g>


  <!-- Right Column -->
  <!-- 7. Battery -->
  <g transform="translate(250, 10)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Battery</text>
    <!-- Cell 1 -->
    <line x1="350" y1="10" x2="355" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="355" y1="0" x2="355" y2="20" stroke="#64748B" stroke-width="1.5" />
    <line x1="362" y1="5" x2="362" y2="15" stroke="#475569" stroke-width="3" />
    <!-- Cell 2 -->
    <line x1="362" y1="10" x2="367" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="367" y1="0" x2="367" y2="20" stroke="#64748B" stroke-width="1.5" />
    <line x1="374" y1="5" x2="374" y2="15" stroke="#475569" stroke-width="3" />
    <!-- Cell 3 -->
    <line x1="374" y1="10" x2="379" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="379" y1="0" x2="379" y2="20" stroke="#64748B" stroke-width="1.5" />
    <line x1="386" y1="5" x2="386" y2="15" stroke="#475569" stroke-width="3" />
    <line x1="386" y1="10" x2="395" y2="10" stroke="#94A3B8" stroke-width="1.5" />

    <text x="345" y="1" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">+</text>
    <text x="390" y="1" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">-</text>
  </g>

  <!-- 8. Plug Key (Closed) -->
  <g transform="translate(250, 50)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Plug Key (Closed)</text>
    <line x1="350" y1="10" x2="360" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 360 4 A 8 8 0 0 0 368 16" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 372 4 A 8 8 0 0 1 380 16" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="380" y1="10" x2="390" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="370" cy="10" r="2" fill="#64748B" />
  </g>

  <!-- 9. Wires crossing without joining -->
  <g transform="translate(250, 90)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Crossing Wires</text>
    <line x1="350" y1="10" x2="390" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="370" y1="25" x2="370" y2="15" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 365 10 A 5 5 0 0 1 375 10" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="370" y1="5" x2="370" y2="-5" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- 10. Resistor -->
  <g transform="translate(250, 130)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Resistor</text>
    <line x1="350" y1="10" x2="355" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 355 10 L 357.5 4 L 362.5 16 L 367.5 4 L 372.5 16 L 377.5 4 L 382.5 16 L 385 10" fill="none" stroke="#64748B" stroke-width="1.5" />
    <line x1="385" y1="10" x2="390" y2="10" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- 11. Ammeter -->
  <g transform="translate(250, 170)">
    <text x="0" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Ammeter</text>
    <line x1="350" y1="10" x2="360" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="370" cy="10" r="10" fill="none" stroke="#0284C7" stroke-width="1.5" />
    <text x="370" y="13" fill="#1E293B" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">A</text>
    <line x1="380" y1="10" x2="390" y2="10" stroke="#94A3B8" stroke-width="1.5" />
    <text x="352" y="1" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">+</text>
    <text x="382" y="1" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">-</text>
  </g>
</svg>
