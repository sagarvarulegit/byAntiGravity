<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <!-- Definition for markers -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 0 0.5 L 5 3 L 0 5.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Wires (Main Loop) -->
  <path d="M 60 70 L 175 70 M 225 70 L 340 70 L 340 90 M 340 120 L 340 170 L 265 170 M 205 170 L 140 170 M 115 170 L 60 170 L 60 125 M 60 95 L 60 70" fill="none" stroke="#94A3B8" stroke-width="2" />

  <!-- Voltmeter parallel wires -->
  <path d="M 165 70 L 165 35 L 185 35 M 235 70 L 235 35 L 215 35" fill="none" stroke="#94A3B8" stroke-width="1" />

  <!-- Voltmeter (V) -->
  <circle cx="200" cy="35" r="15" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" />
  <text x="200" y="39" fill="#1E293B" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">V</text>
  <text x="200" y="13" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="middle">Voltmeter</text>

  <!-- Resistor (R) -->
  <path d="M 175 70 L 179 64 L 187 76 L 195 64 L 203 76 L 211 64 L 219 76 L 225 70" fill="none" stroke="#64748B" stroke-width="2" />
  <text x="200" y="86" fill="#94A3B8" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Resistor (R)</text>

  <!-- Ammeter (A) -->
  <circle cx="340" cy="105" r="15" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" />
  <text x="340" y="109" fill="#1E293B" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">A</text>
  <text x="365" y="108" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="start">Ammeter</text>

  <!-- Battery -->
  <g transform="translate(115, 170)">
    <!-- Plate 1 -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#475569" stroke-width="2" />
    <line x1="5" y1="-6" x2="5" y2="6" stroke="#475569" stroke-width="3.5" />
    <line x1="5" y1="0" x2="10" y2="0" stroke="#94A3B8" stroke-width="2" />
    <!-- Plate 2 -->
    <line x1="10" y1="-10" x2="10" y2="10" stroke="#475569" stroke-width="2" />
    <line x1="15" y1="-6" x2="15" y2="6" stroke="#475569" stroke-width="3.5" />
    <line x1="15" y1="0" x2="20" y2="0" stroke="#94A3B8" stroke-width="2" />
    <!-- Plate 3 -->
    <line x1="20" y1="-10" x2="20" y2="10" stroke="#475569" stroke-width="2" />
    <line x1="25" y1="-6" x2="25" y2="6" stroke="#475569" stroke-width="3.5" />
    
    <text x="-8" y="-12" fill="#EF4444" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">+</text>
    <text x="32" y="-12" fill="#EF4444" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">-</text>
    <text x="12" y="20" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="middle">Battery</text>
  </g>

  <!-- Key (K) -->
  <g transform="translate(235, 170)">
    <path d="M -10 -6 A 8 8 0 0 1 -2 6" fill="none" stroke="#94A3B8" stroke-width="2" />
    <path d="M 2 -6 A 8 8 0 0 0 10 6" fill="none" stroke="#94A3B8" stroke-width="2" />
    <circle cx="0" cy="0" r="2" fill="#64748B" />
    <text x="0" y="18" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="middle">Key (K)</text>
  </g>

  <!-- Rheostat (Variable Resistor) -->
  <g transform="translate(60, 110)">
    <path d="M 0 -20 L -5 -15 L 5 -9 L -5 -3 L 5 3 L -5 9 L 5 15 L 0 20" fill="none" stroke="#94A3B8" stroke-width="2" />
    <!-- Arrow -->
    <line x1="15" y1="25" x2="-8" y2="-25" stroke="#EF4444" stroke-width="1.2" />
    <polygon points="-8,-25 -4,-22 -10,-20" fill="#EF4444" />
    <text x="-35" y="4" fill="#94A3B8" font-family="sans-serif" font-size="8">Rheostat (Rh)</text>
  </g>

  <!-- Current Direction Arrows and Label 'I' -->
  <line x1="60" y1="125" x2="60" y2="120" stroke="#EF4444" stroke-width="1" marker-end="url(#arrow)" />
  <text x="70" y="123" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">I</text>

  <line x1="120" y1="70" x2="125" y2="70" stroke="#EF4444" stroke-width="1" marker-end="url(#arrow)" />
  <text x="122" y="62" fill="#EF4444" font-family="sans-serif" font-size="8" font-weight="bold">I</text>

  <line x1="340" y1="130" x2="340" y2="135" stroke="#EF4444" stroke-width="1" marker-end="url(#arrow)" />
</svg>
