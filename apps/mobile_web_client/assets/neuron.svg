<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <!-- Definitions for marker dots -->
  <defs>
    <marker id="pointer-dot" markerWidth="3" markerHeight="3" refX="1.5" refY="1.5">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- Cell Body (Soma) with 7 star points -->
  <path d="M 60 76 L 68 94 L 88 88 L 78 105 L 94 118 L 74 122 L 68 142 L 56 126 L 36 128 L 48 114 L 32 98 L 52 98 Z" fill="#0284C7" fill-opacity="0.12" stroke="#0284C7" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Nucleus -->
  <circle cx="60" cy="110" r="6" fill="#0284C7" />

  <!-- Axon (Inner tube) -->
  <line x1="84" y1="110" x2="250" y2="110" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Myelin Sheaths (3 Yellow cells) -->
  <rect x="95" y="102" width="38" height="16" rx="4" fill="#FEF08A" fill-opacity="0.5" stroke="#EAB308" stroke-width="1.2" />
  <rect x="143" y="102" width="38" height="16" rx="4" fill="#FEF08A" fill-opacity="0.5" stroke="#EAB308" stroke-width="1.2" />
  <rect x="191" y="102" width="38" height="16" rx="4" fill="#FEF08A" fill-opacity="0.5" stroke="#EAB308" stroke-width="1.2" />

  <!-- Nerve Endings (Branching terminals) -->
  <path d="M 250 110 L 265 110 M 265 110 L 278 95 M 278 95 L 286 91 M 265 110 L 278 125 M 278 125 L 288 129" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
  
  <!-- Terminal Buttons -->
  <circle cx="286" cy="91" r="3" fill="#475569" />
  <circle cx="288" cy="129" r="3" fill="#475569" />

  <!-- Dotted pointer lines and labels -->
  <!-- Dendrite pointer -->
  <line x1="45" y1="58" x2="52" y2="84" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" marker-start="url(#pointer-dot)" />
  <text x="20" y="52" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">Dendrite</text>

  <!-- Cell Body pointer -->
  <line x1="120" y1="46" x2="72" y2="92" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" marker-start="url(#pointer-dot)" />
  <text x="120" y="42" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">Cell Body (Soma)</text>

  <!-- Myelin Sheath pointer -->
  <line x1="200" y1="62" x2="162" y2="102" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" marker-start="url(#pointer-dot)" />
  <text x="200" y="58" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">Myelin Sheath</text>

  <!-- Nucleus pointer -->
  <line x1="40" y1="168" x2="58" y2="114" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" marker-start="url(#pointer-dot)" />
  <text x="20" y="178" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">Nucleus</text>

  <!-- Axon pointer -->
  <line x1="125" y1="168" x2="125" y2="114" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" marker-start="url(#pointer-dot)" />
  <text x="115" y="178" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">Axon</text>

  <!-- Nerve Ending pointer -->
  <line x1="240" y1="168" x2="268" y2="116" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" marker-start="url(#pointer-dot)" />
  <text x="220" y="178" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">Nerve Ending</text>
</svg>
