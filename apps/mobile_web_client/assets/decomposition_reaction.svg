<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <radialGradient id="flameGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FACC15" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Line / Bench -->
  <line x1="20" y1="210" x2="380" y2="210" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Bunsen Burner -->
  <!-- Base -->
  <path d="M 120 210 L 160 210 L 150 200 L 130 200 Z" fill="#475569" />
  <!-- Stem -->
  <rect x="136" y="145" width="8" height="55" fill="#64748B" />
  <!-- Collar -->
  <rect x="134" y="140" width="12" height="5" fill="#94A3B8" />
  <!-- Flame -->
  <path d="M 140 140 C 128 120, 132 95, 140 85 C 148 95, 152 120, 140 140 Z" fill="url(#flameGrad)" />

  <!-- Stand & Clamp -->
  <!-- Base -->
  <rect x="260" y="200" width="80" height="10" fill="#475569" rx="2" />
  <!-- Rod -->
  <rect x="296" y="50" width="8" height="150" fill="#64748B" />
  <!-- Clamp Bosshead -->
  <rect x="288" y="90" width="16" height="10" fill="#334155" rx="1" />
  <!-- Clamp Arm -->
  <rect x="230" y="93" width="60" height="4" fill="#475569" />
  <!-- Clamp Jaws -->
  <path d="M 225 80 L 230 95 L 225 110" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- Boiling Tube (Rotated) -->
  <g transform="translate(190, 100) rotate(-25)">
    <!-- Liquid / Solid Product inside -->
    <path d="M -12 25 L 12 25 L 12 55 C 12 62, -12 62, -12 55 Z" fill="#CBD5E1" opacity="0.8" />
    <!-- Tube Outline -->
    <path d="M -12 -55 L -12 55 C -12 65, 12 65, 12 55 L 12 -55" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <!-- Rim -->
    <ellipse cx="0" cy="-55" rx="14" ry="3" fill="none" stroke="#94A3B8" stroke-width="2" />
  </g>

  <!-- Gas Bubbles / Evolving CO2 escaping -->
  <ellipse cx="232" cy="52" rx="4" ry="4" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.6" />
  <ellipse cx="245" cy="40" rx="5" ry="5" fill="none" stroke="#CBD5E1" stroke-width="1.5" opacity="0.5" />
  <ellipse cx="260" cy="32" rx="6" ry="6" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.4" />
  
  <!-- Text Labels -->
  <text x="50" y="180" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Bunsen Burner</text>
  <path d="M 115 177 Q 130 177, 134 177" stroke="#94A3B8" stroke-width="1" />

  <text x="30" y="100" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Boiling Tube</text>
  <path d="M 90 98 Q 130 98, 162 103" fill="none" stroke="#94A3B8" stroke-width="1" />

  <text x="20" y="125" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Calcium Carbonate</text>
  <text x="20" y="137" fill="#94A3B8" font-family="sans-serif" font-size="8" font-weight="bold">CaCO₃ (Limestone)</text>
  <path d="M 115 128 Q 150 128, 175 128" fill="none" stroke="#94A3B8" stroke-width="1" />

  <text x="270" y="15" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Carbon Dioxide (CO₂) Gas</text>
  <path d="M 265 20 Q 255 25, 248 35" fill="none" stroke="#94A3B8" stroke-width="1" />

  <text x="320" y="125" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Iron Stand</text>
  <path d="M 315 122 Q 305 120, 301 115" fill="none" stroke="#94A3B8" stroke-width="1" />
</svg>
