<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="100%" height="100%">
  <defs>
    <!-- Bunsen Burner Flame -->
    <radialGradient id="flameGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FACC15" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* Flame Flickering */
    .flicker-flame {
      animation: flicker 0.2s infinite alternate ease-in-out;
    }
    @keyframes flicker {
      0% { transform: scaleX(0.95) scaleY(0.95); }
      100% { transform: scaleX(1.05) scaleY(1.05); }
    }

    /* Crystals changing color (green to reddish-brown) */
    .crystals {
      animation: changeColor 6s infinite ease-in-out;
    }
    @keyframes changeColor {
      0%, 20% { fill: #34D399; } /* Green FeSO4 */
      50%, 80% { fill: #7C2D12; } /* Reddish-brown Fe2O3 */
      100% { fill: #34D399; }
    }

    /* Fumes/smoke path escaping from the boiling tube */
    .fumes {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: releaseFumes 6s infinite linear;
      opacity: 0;
    }
    .f-1 { animation-delay: 1.8s; }
    .f-2 { animation-delay: 2.3s; }
    .f-3 { animation-delay: 2.8s; }

    @keyframes releaseFumes {
      0%, 25% { stroke-dashoffset: 100; opacity: 0; }
      30% { opacity: 0.6; }
      60%, 80% { stroke-dashoffset: 0; opacity: 0.8; }
      85%, 100% { opacity: 0; }
    }
  </style>

  <!-- Ground Line / Bench -->
  <line x1="20" y1="210" x2="400" y2="210" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />

  <!-- LEFT COLUMN: Instruction / Legend -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="135" height="150" rx="8" fill="#F8FAFC" fill-opacity="0.05" stroke="#475569" stroke-width="1" />
    
    <text x="12" y="20" fill="#94A3B8" font-family="sans-serif" font-size="9.5" font-weight="bold">ACT 1.5: FeSO₄</text>
    
    <circle cx="18" cy="45" r="3" fill="#34D399" />
    <text x="28" y="48" fill="#94A3B8" font-family="sans-serif" font-size="8.5">1. Green crystals in tube</text>

    <circle cx="18" cy="75" r="3" fill="#EF4444" />
    <text x="28" y="78" fill="#94A3B8" font-family="sans-serif" font-size="8.5">2. Heat decomposes it</text>
    <text x="28" y="90" fill="#64748B" font-family="sans-serif" font-size="7.5">(Turns reddish-brown)</text>

    <circle cx="18" cy="115" r="3" fill="#E2E8F0" />
    <text x="28" y="118" fill="#94A3B8" font-family="sans-serif" font-size="8.5">3. SO₂ &amp; SO₃ gas fumes</text>
    <text x="28" y="130" fill="#E2E8F0" font-family="sans-serif" font-size="7.5" font-weight="bold">(Choking sulphur smell)</text>
  </g>

  <!-- RIGHT COLUMN: Experimental setup -->
  <g transform="translate(180, 0)">
    <!-- Bunsen Burner -->
    <g transform="translate(20, 0)">
      <path d="M 60 210 L 100 210 L 90 200 L 70 200 Z" fill="#334155" />
      <rect x="76" y="145" width="8" height="55" fill="#475569" />
      <rect x="74" y="140" width="12" height="5" fill="#64748B" />
      <!-- Flame -->
      <path class="flicker-flame" d="M 80 140 C 68 120, 72 95, 80 85 C 88 95, 92 120, 80 140 Z" fill="url(#flameGrad)" style="transform-origin: 80px 140px;" />
    </g>

    <!-- Stand & Clamp -->
    <rect x="150" y="200" width="70" height="10" fill="#334155" rx="2" />
    <rect x="180" y="50" width="6" height="150" fill="#475569" />
    <rect x="174" y="90" width="12" height="10" fill="#1E293B" rx="1" />
    <rect x="120" y="93" width="55" height="4" fill="#475569" />
    <path d="M 115 80 L 120 95 L 115 110" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />

    <!-- Boiling Tube (Rotated) -->
    <g transform="translate(80, 100) rotate(-25)">
      <!-- Chemical inside -->
      <path class="crystals" d="M -12 25 L 12 25 L 12 55 C 12 62, -12 62, -12 55 Z" fill="#34D399" />
      
      <!-- Tube Outline -->
      <path d="M -12 -55 L -12 55 C -12 65, 12 65, 12 55 L 12 -55" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
      <!-- Rim -->
      <ellipse cx="0" cy="-55" rx="14" ry="3" fill="none" stroke="#94A3B8" stroke-width="2" />

      <!-- Fume animation lines escaping from the mouth -->
      <path class="fumes f-1" d="M 0 -58 Q -10 -80, -25 -100" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />
      <path class="fumes f-2" d="M 5 -57 Q 15 -75, 5 -105" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      <path class="fumes f-3" d="M -5 -57 Q 5 -85, -15 -110" fill="none" stroke="#E2E8F0" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Labels -->
    <text x="80" y="25" fill="#94A3B8" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">SO₂ + SO₃ Gas Fumes</text>
    <path d="M 80 30 Q 80 38, 70 48" fill="none" stroke="#64748B" stroke-width="1" />
    
    <text x="120" y="160" fill="#94A3B8" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">FeSO₄ Crystals</text>
    <path d="M 105 150 Q 95 135, 75 125" fill="none" stroke="#64748B" stroke-width="1" />
  </g>
</svg>
