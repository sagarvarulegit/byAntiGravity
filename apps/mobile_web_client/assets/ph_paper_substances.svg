<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background-color: #1E293B; border-radius: 8px;">
  <title>pH of Common Substances</title>
  
  <text x="640" y="60" font-family="Georgia" font-size="36" font-weight="bold" fill="#F8FAFC" text-anchor="middle">pH of Some Common Substances on pH Paper</text>

  <!-- Large pH Strip -->
  <g transform="translate(140, 300)">
    <rect x="0" y="0" width="1000" height="80" rx="40" fill="none" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Colors -->
    <rect x="10" y="10" width="122" height="60" fill="#EF4444" /> <!-- 0-2 -->
    <rect x="132" y="10" width="122" height="60" fill="#F97316" /> <!-- 3-4 -->
    <rect x="254" y="10" width="122" height="60" fill="#FBBF24" /> <!-- 5-6 -->
    <rect x="376" y="10" width="122" height="60" fill="#22C55E" /> <!-- 7 -->
    <rect x="498" y="10" width="122" height="60" fill="#06B6D4" /> <!-- 8-9 -->
    <rect x="620" y="10" width="122" height="60" fill="#3B82F6" /> <!-- 10-11 -->
    <rect x="742" y="10" width="122" height="60" fill="#6366F1" /> <!-- 12-13 -->
    <rect x="864" y="10" width="126" height="60" fill="#8B5CF6" /> <!-- 14 -->

    <!-- Markers & Substances -->
    <g font-family="Arial" font-size="18" fill="#F8FAFC" text-anchor="middle">
      <circle cx="50" cy="40" r="15" fill="#1E293B" opacity="0.6" />
      <text x="50" y="46">1</text>
      <line x1="50" y1="0" x2="50" y2="-40" stroke="#F8FAFC" stroke-width="2" />
      <text x="50" y="-50" font-weight="bold">Gastric Juice (~1.2)</text>

      <circle cx="150" cy="40" r="15" fill="#1E293B" opacity="0.6" />
      <text x="150" y="46">2</text>
      <line x1="150" y1="80" x2="150" y2="120" stroke="#F8FAFC" stroke-width="2" />
      <text x="150" y="140" font-weight="bold">Lemon Juice (~2.2)</text>

      <circle cx="310" cy="40" r="15" fill="#1E293B" opacity="0.6" />
      <text x="310" y="46">5</text>
      <line x1="310" y1="0" x2="310" y2="-40" stroke="#F8FAFC" stroke-width="2" />
      <text x="310" y="-50" font-weight="bold">Coffee (~5.0)</text>
      
      <circle cx="437" cy="40" r="15" fill="#1E293B" opacity="0.6" />
      <text x="437" y="46">7</text>
      <line x1="437" y1="80" x2="437" y2="120" stroke="#F8FAFC" stroke-width="2" />
      <text x="437" y="140" font-weight="bold">Pure Water / Blood (7.4)</text>
      
      <circle cx="680" cy="40" r="15" fill="#1E293B" opacity="0.6" />
      <text x="680" y="46">10</text>
      <line x1="680" y1="0" x2="680" y2="-40" stroke="#F8FAFC" stroke-width="2" />
      <text x="680" y="-50" font-weight="bold">Milk of Magnesia (10)</text>
      
      <circle cx="927" cy="40" r="15" fill="#1E293B" opacity="0.6" />
      <text x="927" y="46">14</text>
      <line x1="927" y1="80" x2="927" y2="120" stroke="#F8FAFC" stroke-width="2" />
      <text x="927" y="140" font-weight="bold">Sodium Hydroxide (~14)</text>
    </g>
  </g>
</svg>