<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="100%" height="100%">
  <!-- Definition for Arrows -->
  <defs>
    <marker id="blue-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#0284C7" />
    </marker>
    <marker id="red-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#E11D48" />
    </marker>
  </defs>

  <!-- Legend -->
  <g transform="translate(20, 15)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#0284C7" />
    <text x="15" y="9" fill="#94A3B8" font-family="sans-serif" font-size="8" font-weight="bold">Deoxygenated (CO₂ Rich)</text>

    <rect x="250" y="0" width="10" height="10" rx="2" fill="#E11D48" />
    <text x="265" y="9" fill="#94A3B8" font-family="sans-serif" font-size="8" font-weight="bold">Oxygenated (O₂ Rich)</text>
  </g>

  <!-- Lungs Box -->
  <rect x="125" y="40" width="200" height="40" rx="6" fill="#F0FDFA" stroke="#2DD4BF" stroke-width="1.5" />
  <text x="225" y="58" fill="#111827" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LUNGS</text>
  <text x="225" y="70" fill="#0F766E" font-family="sans-serif" font-size="8" text-anchor="middle">Gaseous Exchange (Capillaries)</text>

  <!-- Body Organs Box -->
  <rect x="125" y="235" width="200" height="40" rx="6" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5" />
  <text x="225" y="253" fill="#111827" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">BODY ORGANS</text>
  <text x="225" y="265" fill="#C2410C" font-family="sans-serif" font-size="8" text-anchor="middle">Systemic Circulation</text>

  <!-- Heart Box -->
  <rect x="112" y="105" width="225" height="100" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
  <text x="225" y="120" fill="#475569" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">HEART</text>

  <!-- Septum (Divider) -->
  <line x1="225" y1="105" x2="225" y2="205" stroke="#64748B" stroke-width="3" />

  <!-- Internal Heart Chambers (Left side of drawing = Right side of heart) -->
  <!-- Right Atrium -->
  <text x="170" y="140" fill="#0284C7" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RA</text>
  <text x="170" y="152" fill="#475569" font-family="sans-serif" font-size="8" text-anchor="middle">Right Atrium</text>

  <!-- Right Ventricle -->
  <text x="170" y="180" fill="#0284C7" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RV</text>
  <text x="170" y="192" fill="#475569" font-family="sans-serif" font-size="8" text-anchor="middle">Right Ventricle</text>

  <!-- Valves (Horizontal Divider) -->
  <line x1="112" y1="160" x2="225" y2="160" stroke="#94A3B8" stroke-width="1" />
  <line x1="225" y1="160" x2="337" y2="160" stroke="#94A3B8" stroke-width="1" />

  <!-- Left Atrium (Right side of drawing) -->
  <text x="280" y="140" fill="#E11D48" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LA</text>
  <text x="280" y="152" fill="#475569" font-family="sans-serif" font-size="8" text-anchor="middle">Left Atrium</text>

  <!-- Left Ventricle -->
  <text x="280" y="180" fill="#E11D48" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LV</text>
  <text x="280" y="192" fill="#475569" font-family="sans-serif" font-size="8" text-anchor="middle">Left Ventricle</text>

  <!-- Blood Vessel Connections (Curves) -->

  <!-- Vena Cava (Deoxygenated from Body to RA) -->
  <path d="M 160 235 C 40 220, 40 130, 112 125" fill="none" stroke="#0284C7" stroke-width="3" marker-end="url(#blue-arrow)" />
  <text x="65" y="190" fill="#94A3B8" font-family="Georgia" font-size="9" font-style="italic">Vena Cava</text>

  <!-- Pulmonary Artery (Deoxygenated from RV to Lungs) -->
  <path d="M 170 205 C 80 215, 80 80, 160 80" fill="none" stroke="#0284C7" stroke-width="3" marker-end="url(#blue-arrow)" />
  <text x="75" y="95" fill="#94A3B8" font-family="Georgia" font-size="9" font-style="italic">Pulmonary Artery</text>

  <!-- Pulmonary Vein (Oxygenated from Lungs to LA) -->
  <path d="M 290 80 C 370 80, 370 130, 337 130" fill="none" stroke="#E11D48" stroke-width="3" marker-end="url(#red-arrow)" />
  <text x="365" y="95" fill="#94A3B8" font-family="Georgia" font-size="9" font-style="italic" text-anchor="end">Pulmonary Vein</text>

  <!-- Aorta (Oxygenated from LV to Body) -->
  <path d="M 280 205 C 410 210, 410 240, 290 250" fill="none" stroke="#E11D48" stroke-width="3" marker-end="url(#red-arrow)" />
  <text x="380" y="225" fill="#94A3B8" font-family="Georgia" font-size="9" font-style="italic" text-anchor="end">Aorta</text>
</svg>
