<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background-color: #1E293B; border-radius: 8px;">
  <title>Passing CO2 through Lime Water</title>
  
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="woodBench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C3D2E"/>
      <stop offset="100%" stop-color="#3D251E"/>
    </linearGradient>
  </defs>

  <!-- BENCH -->
  <rect x="0" y="580" width="1280" height="140" fill="url(#woodBench)" />
  <line x1="0" y1="580" x2="1280" y2="580" stroke="#475569" stroke-width="4" />

  <text x="640" y="60" font-family="Georgia" font-size="36" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Passing CO₂ gas through Lime Water</text>

  <!-- TUBE 1 (Reaction Tube - Left) -->
  <g transform="translate(300, 200)">
    <!-- Stand Base -->
    <rect x="-40" y="380" width="120" height="10" fill="#64748B" />
    <rect x="10" y="100" width="10" height="280" fill="#94A3B8" />
    <!-- Clamp -->
    <rect x="20" y="150" width="60" height="8" fill="#475569" />

    <!-- Test Tube -->
    <!-- Liquid -->
    <path d="M 95 320 L 145 320 C 145 360, 95 360, 95 320 Z" fill="#E2E8F0" fill-opacity="0.3" stroke="none" />
    <!-- Glass -->
    <path d="M 90 100 L 90 320 C 90 380, 150 380, 150 320 L 150 100 Z" fill="url(#glassGrad)" fill-opacity="0.1" stroke="#E2E8F0" stroke-width="3" />
    
    <!-- Cork -->
    <rect x="92" y="100" width="56" height="30" fill="#CD853F" />

    <!-- Thistle funnel -->
    <path d="M 100 20 L 120 20 L 115 100 L 105 100 Z" fill="url(#glassGrad)" stroke="#E2E8F0" stroke-width="2" />
    <rect x="108" y="100" width="4" height="200" fill="#E2E8F0" opacity="0.6" />
    <ellipse cx="110" cy="20" rx="20" ry="10" fill="none" stroke="#E2E8F0" stroke-width="2" />

    <!-- Delivery Tube start -->
    <path d="M 130 110 L 130 50 C 130 30, 160 30, 160 30 L 350 30" fill="none" stroke="#E2E8F0" stroke-width="6" />
    <path d="M 130 110 L 130 50 C 130 30, 160 30, 160 30 L 350 30" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="10,10" />
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite" />
    </path>

    <!-- Bubbles -->
    <circle cx="120" cy="330" r="3" fill="#60A5FA" opacity="0.6">
      <animate attributeName="cy" from="330" to="200" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- TUBE 2 (Lime Water Tube - Right) -->
  <g transform="translate(700, 300)">
    <!-- Stand Base -->
    <rect x="-40" y="280" width="120" height="10" fill="#64748B" />
    
    <!-- Test Tube -->
    <!-- Lime Water (Milky) -->
    <path d="M 35 180 L 85 180 C 85 280, 35 280, 35 180 Z" fill="#F8FAFC" fill-opacity="0.8" stroke="none">
      <animate attributeName="fill-opacity" from="0.1" to="0.95" dur="10s" fill="freeze" />
    </path>
    <!-- Glass -->
    <path d="M 30 0 L 30 220 C 30 280, 90 280, 90 220 L 90 0 Z" fill="url(#glassGrad)" fill-opacity="0.1" stroke="#E2E8F0" stroke-width="3" />

    <!-- Delivery Tube end -->
    <path d="M -50 -70 L 60 -70 C 80 -70, 80 -50, 80 -50 L 80 200" fill="none" stroke="#E2E8F0" stroke-width="6" />
    <path d="M -50 -70 L 60 -70 C 80 -70, 80 -50, 80 -50 L 80 200" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="10,10" />
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite" />
    </path>

    <!-- CO2 bubbles in Lime Water -->
    <circle cx="80" cy="210" r="4" fill="#E2E8F0" opacity="0.8">
      <animate attributeName="cy" from="210" to="180" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="70" cy="205" r="3" fill="#E2E8F0" opacity="0.8">
      <animate attributeName="cy" from="205" to="180" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Labels -->
  <text x="350" y="300" font-family="Arial" font-size="20" font-weight="bold" fill="#CBD5E1">Dilute HCl</text>
  <text x="360" y="550" font-family="Arial" font-size="20" font-weight="bold" fill="#CBD5E1">Sodium carbonate</text>
  
  <text x="650" y="160" font-family="Arial" font-size="20" font-weight="bold" fill="#38BDF8">CO₂ Gas Delivery Tube</text>
  
  <text x="830" y="500" font-family="Arial" font-size="20" font-weight="bold" fill="#CBD5E1">Lime water</text>
  <text x="830" y="530" font-family="Arial" font-size="16" font-style="italic" fill="#94A3B8">(turns milky)</text>

  <!-- Equations -->
  <text x="400" y="650" font-family="Georgia" font-size="28" font-weight="bold" fill="#F8FAFC">Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O</text>
</svg>