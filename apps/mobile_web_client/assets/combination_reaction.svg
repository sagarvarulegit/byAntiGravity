<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <!-- Ground Line / Bench -->
  <line x1="20" y1="210" x2="380" y2="210" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Beaker -->
  <!-- Liquid (Water / Slaked Lime Solution) -->
  <rect x="145" y="115" width="110" height="90" fill="#93C5FD" fill-opacity="0.25" rx="5" />
  <!-- Beaker Outline -->
  <path d="M 140 85 L 140 205 Q 140 210, 145 210 L 255 210 Q 260 210, 260 205 L 260 85" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <!-- Lip -->
  <path d="M 137 85 L 143 85" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <path d="M 257 85 L 263 85" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

  <!-- CaO Solid Pile (Quicklime) at bottom -->
  <path d="M 155 210 C 160 190, 175 190, 185 210" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
  <path d="M 210 210 C 215 185, 235 185, 245 210" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
  <path d="M 180 210 C 190 180, 215 180, 225 210" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1" />

  <!-- Water Drops falling in -->
  <path d="M 180 50 Q 180 60, 177 65 Q 180 68, 183 65 Q 180 60, 180 50" fill="#3B82F6" />
  <path d="M 200 62 Q 200 70, 198 74 Q 200 76, 202 74 Q 200 70, 200 62" fill="#3B82F6" />
  <path d="M 220 45 Q 220 53, 218 57 Q 220 59, 222 57 Q 220 53, 220 45" fill="#3B82F6" />

  <!-- Steam / Heat Waves rising -->
  <path d="M 160 100 Q 155 90, 160 80 T 160 60" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 200 95 Q 195 82, 200 70 T 200 50" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 240 100 Q 235 90, 240 80 T 240 60" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Exothermic Heat Glow (Orange Rays on the Beaker sides) -->
  <path d="M 125 140 Q 115 150, 125 160" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" />
  <path d="M 120 145 Q 110 150, 120 155" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 275 140 Q 285 150, 275 160" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" />
  <path d="M 280 145 Q 290 150, 280 155" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" />

  <!-- Text Labels -->
  <text x="35" y="45" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Water (H₂O) entering</text>
  <path d="M 120 42 Q 150 42, 168 47" fill="none" stroke="#94A3B8" stroke-width="1" />

  <text x="20" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Beaker</text>
  <path d="M 58 112 Q 95 112, 137 112" fill="none" stroke="#94A3B8" stroke-width="1" />

  <text x="20" y="170" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Exothermic Reaction</text>
  <text x="20" y="182" fill="#F97316" font-family="sans-serif" font-size="8" font-weight="bold">(Feels Hot / Releases Heat)</text>
  <path d="M 115 174 Q 130 174, 142 165" fill="none" stroke="#94A3B8" stroke-width="1" />

  <text x="280" y="125" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Slaked Lime Solution</text>
  <text x="280" y="137" fill="#94A3B8" font-family="sans-serif" font-size="8" font-weight="bold">Ca(OH)₂ (aq)</text>
  <path d="M 275 125 Q 260 125, 230 135" fill="none" stroke="#94A3B8" stroke-width="1" />

  <text x="280" y="195" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">Quicklime Solid</text>
  <text x="280" y="207" fill="#94A3B8" font-family="sans-serif" font-size="8" font-weight="bold">CaO (s)</text>
  <path d="M 275 195 Q 240 195, 222 201" fill="none" stroke="#94A3B8" stroke-width="1" />
</svg>
