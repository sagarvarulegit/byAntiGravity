<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background-color: #1E293B; border-radius: 8px;">
  <title>Acid Solution in Water Conducts Electricity</title>
  
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="woodBench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C3D2E"/>
      <stop offset="100%" stop-color="#3D251E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <rect x="0" y="580" width="1280" height="140" fill="url(#woodBench)" />
  <line x1="0" y1="580" x2="1280" y2="580" stroke="#475569" stroke-width="4" />

  <text x="640" y="60" font-family="Georgia" font-size="36" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Acid Solution in Water Conducts Electricity</text>

  <!-- BEAKER -->
  <g transform="translate(500, 300)">
    <!-- Acid Solution -->
    <path d="M 15 150 L 265 150 C 265 270, 15 270, 15 150 Z" fill="#60A5FA" fill-opacity="0.2" />
    <ellipse cx="140" cy="150" rx="125" ry="15" fill="#60A5FA" fill-opacity="0.3" stroke="#93C5FD" stroke-width="2" />
    
    <!-- Glass Beaker -->
    <path d="M 0 0 L 0 260 C 0 300, 280 300, 280 260 L 280 0 Z" fill="url(#glassGrad)" fill-opacity="0.1" stroke="#E2E8F0" stroke-width="4" stroke-linejoin="round" />
    <ellipse cx="140" cy="0" rx="140" ry="15" fill="none" stroke="#E2E8F0" stroke-width="4" />

    <!-- Rubber Cork (inside beaker bottom) -->
    <rect x="80" y="220" width="120" height="40" rx="5" fill="#CD853F" />
    
    <!-- Nails (Electrodes) -->
    <rect x="100" y="100" width="8" height="120" fill="#94A3B8" stroke="#475569" stroke-width="2" />
    <rect x="172" y="100" width="8" height="120" fill="#94A3B8" stroke="#475569" stroke-width="2" />

    <!-- Wire Connections inside beaker -->
    <path d="M 104 100 L 104 -50" fill="none" stroke="#EF4444" stroke-width="3" />
    <path d="M 176 100 L 176 -50" fill="none" stroke="#10B981" stroke-width="3" />
    
    <text x="-60" y="240" font-family="Arial" font-size="20" fill="#CBD5E1">Rubber Cork</text>
    <text x="-40" y="140" font-family="Arial" font-size="20" fill="#CBD5E1">Nails</text>
    <text x="-80" y="190" font-family="Arial" font-size="20" fill="#CBD5E1">Dilute HCl solution</text>
  </g>

  <!-- CIRCUIT -->
  <g transform="translate(500, 100)">
    <!-- Wires -->
    <path d="M 104 150 L 104 50 L 250 50" fill="none" stroke="#EF4444" stroke-width="3" />
    <path d="M 176 150 L 176 100 L 320 100 L 320 50" fill="none" stroke="#10B981" stroke-width="3" />

    <!-- Battery -->
    <g transform="translate(250, 30)">
      <rect x="0" y="0" width="40" height="40" fill="#FACC15" />
      <rect x="40" y="0" width="40" height="40" fill="#1E293B" stroke="#FACC15" stroke-width="2" />
      <text x="20" y="65" font-family="Arial" font-size="20" fill="#FACC15" text-anchor="middle">6 V</text>
      <text x="40" y="-10" font-family="Arial" font-size="20" fill="#CBD5E1" text-anchor="middle">Battery</text>
    </g>

    <!-- Wire to Bulb -->
    <path d="M 330 50 L 400 50 L 400 120" fill="none" stroke="#3B82F6" stroke-width="3" />
    
    <!-- Bulb (Glowing) -->
    <g transform="translate(380, 120)">
      <!-- Glow effect -->
      <circle cx="20" cy="20" r="50" fill="url(#glow)">
        <animate attributeName="opacity" values="0.6; 1; 0.6" dur="0.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="20" cy="20" r="20" fill="#FEF08A" />
      <path d="M 10 40 L 30 40 L 25 55 L 15 55 Z" fill="#94A3B8" />
      <text x="60" y="30" font-family="Arial" font-size="20" fill="#FEF08A" font-weight="bold">Bulb Glowing!</text>
    </g>

    <!-- Wire back to switch -->
    <path d="M 400 175 L 400 250 L 360 250" fill="none" stroke="#3B82F6" stroke-width="3" />
    <path d="M 320 100 L 320 250 L 340 250" fill="none" stroke="#10B981" stroke-width="3" />
    
    <!-- Switch -->
    <g transform="translate(340, 240)">
      <circle cx="0" cy="10" r="5" fill="#F8FAFC" />
      <circle cx="20" cy="10" r="5" fill="#F8FAFC" />
      <line x1="0" y1="10" x2="20" y2="10" stroke="#F8FAFC" stroke-width="4" />
      <text x="10" y="40" font-family="Arial" font-size="20" fill="#CBD5E1" text-anchor="middle">Switch</text>
    </g>
  </g>

  <!-- Ions floating -->
  <text x="560" y="400" font-family="Georgia" font-size="24" font-weight="bold" fill="#F8FAFC">H⁺</text>
  <text x="680" y="420" font-family="Georgia" font-size="24" font-weight="bold" fill="#F8FAFC">Cl⁻</text>
  <text x="600" y="480" font-family="Georgia" font-size="24" font-weight="bold" fill="#F8FAFC">H⁺</text>

  <!-- Explanation -->
  <text x="250" y="650" font-family="Arial" font-size="22" font-style="italic" fill="#38BDF8">Acids produce H⁺ ions in aqueous solution, which are responsible for conducting electricity.</text>
</svg>